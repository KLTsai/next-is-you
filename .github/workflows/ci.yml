name: CI

# One change is one run. Pull request pushes and pushes to main each start one
# run; tag pushes start none, because `branches` filters them out. Each gate is
# its own job so a red run names the gate that failed and the others still
# report their own result.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format-lint:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --group dev --locked
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:ui

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --group dev --locked
      - run: uv run python scripts/check_migrations.py

  # The suite is split across machines because its browser tests cannot run
  # in parallel on one: they share dist/, pywrangler's files and ports.
  # pytest-split balances the groups by .test_durations (README.md says how
  # to refresh it). Each leg reports on its own, so fail-fast stays off.
  backend-browser-shards:
    name: Backend and browser tests shard ${{ matrix.group }} of ${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --group dev --locked
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration

  # The gate. Its name is what scripts/delivery_state.py GATES and Summary
  # read, so the shards' own check names never stand in for it.
  backend-browser-tests:
    name: Backend and browser tests
    if: ${{ always() }}
    needs:
      - backend-browser-shards
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every shard succeeded
        env:
          SHARDS: ${{ needs.backend-browser-shards.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "At least one test shard did not succeed: $SHARDS." >&2
            exit 1
          fi

  diff-hygiene:
    name: Diff hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check pushed or pull request diff whitespace, em dashes and commit trailers
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/check_ci_diff.sh

  summary:
    name: Summary
    if: ${{ always() }}
    needs:
      - format-lint
      - typecheck
      - frontend-tests
      - build
      - migrations
      - backend-browser-tests
      - diff-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Write the gate summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Gates"
            echo
            echo "| Gate | Outcome |"
            echo "| --- | --- |"
            # Rows carry each gate's display name, as the checks list does.
            # tests/test_delivery_state.py runs this script and fails if a
            # name here stops matching its job.
            echo "$NEEDS" | jq -r '
              {
                "format-lint": "Formatting and lint",
                "typecheck": "Type check",
                "frontend-tests": "Frontend tests",
                "build": "Build",
                "migrations": "Migration check",
                "backend-browser-tests": "Backend and browser tests",
                "diff-hygiene": "Diff hygiene"
              } as $names
              | to_entries[] | "| \($names[.key] // .key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$NEEDS" | jq -e '[.[].result] | all(. == "success")' >/dev/null; then
            exit 0
          fi
          echo "At least one gate did not succeed." >&2
          exit 1

  staging-scope:
    name: Staging scope
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the push changed only documentation
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: echo "docs_only=$(bash scripts/docs_only_push.sh)" >> "$GITHUB_OUTPUT"

  staging-order:
    name: Staging order
    # Runs after the gates, right before the deployment, so the head of main is
    # read as late as possible. A push whose commit main has already moved past
    # must not deploy over the newer one. The rule is in scripts/delivery_state.py.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - format-lint
      - typecheck
      - frontend-tests
      - build
      - migrations
      - backend-browser-tests
      - diff-hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.order.outputs.deploy }}
    env:
      GH_TOKEN: ${{ github.token }}
      AFTER: ${{ github.sha }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether this commit may deploy over staging
        id: order
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/delivery_state.py staging-order > order.out
          cat order.out
          head -n1 order.out >> "$GITHUB_OUTPUT"
          {
            echo "### Staging order"
            echo
            echo '```'
            cat order.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Reports only. The pause itself is decided by the Deploy staging
      # condition below; this says so on the run page when the variable holds a
      # value that was meant to pause and does not ("yes", "1", "true ").
      - name: Warn about a pause value that does not pause
        env:
          STAGING_DEPLOY_PAUSED: ${{ vars.STAGING_DEPLOY_PAUSED }}
        run: python3 scripts/delivery_state.py pause-warning

  deploy-staging:
    name: Deploy staging
    # Skips are decided here, at job level, so a skipped deployment still leaves
    # a successful run. A failed gate skips this job too, because it needs them.
    # Pause with the repository variable STAGING_DEPLOY_PAUSED set to "true".
    if: >-
      ${{ github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.staging-scope.outputs.docs_only != 'true'
      && needs.staging-order.outputs.deploy == 'true'
      && vars.STAGING_DEPLOY_PAUSED != 'true' }}
    needs:
      - format-lint
      - typecheck
      - frontend-tests
      - build
      - migrations
      - backend-browser-tests
      - diff-hygiene
      - staging-scope
      - staging-order
    runs-on: ubuntu-latest
    # Waiting runs queue instead of cancelling the deployment in progress.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.STAGING_WORKER_URL }}
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # github.sha is the pushed commit, so a re-run of an earlier run deploys
      # that earlier commit, never the current branch head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: uv sync --group dev --locked
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Apply D1 migrations (staging)
        run: uv run python -m pywrangler d1 migrations apply next-is-you-staging --remote --config wrangler.staging.jsonc
      - name: Deploy Worker (staging)
        run: uv run python -m pywrangler deploy --config wrangler.staging.jsonc --keep-vars
      - name: Record deployment summary
        if: always()
        run: |
          {
            echo "### Staging deployment"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Worker: next-is-you-staging"
            echo "- D1 database: next-is-you-staging"
            echo "- Status: ${{ job.status }}"
            echo "- URL: ${{ vars.STAGING_WORKER_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - format-lint
      - typecheck
      - frontend-tests
      - build
      - migrations
      - backend-browser-tests
      - diff-hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
