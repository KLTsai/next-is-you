name: Production deploy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://next-is-you-held.kunger810.workers.dev
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: uv sync --group dev --locked
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Apply D1 migrations (remote)
        run: uv run python -m pywrangler d1 migrations apply next-is-you-production --remote --config wrangler.production.jsonc
      - name: Deploy Worker
        run: uv run python -m pywrangler deploy --config wrangler.production.jsonc --keep-vars
      - name: Record deployment summary
        if: always()
        run: |
          {
            echo "### Deployment: ${{ github.ref_name }}"
            echo ""
            echo "- Worker: next-is-you-held"
            echo "- D1 database: next-is-you-production"
            echo "- Status: ${{ job.status }}"
            echo "- URL: https://next-is-you-held.kunger810.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
