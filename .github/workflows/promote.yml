name: Promote

run-name: Promote ${{ inputs.version }} to production

# The captain's release action. Dispatch it from main with a version number.
# The promote guard decides whether the version may go to production. The rules
# live in scripts/delivery_state.py and this file only runs them. Running it
# for the version already in production is harmless, and running it with an
# earlier version is how production is rolled back (code only; migrations are
# forward-only).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to put in production, for example v0.3.0
        required: true
        type: string

# The token gets nothing by default. A job that needs access declares it.
permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # A dispatch from any other ref would skip every job below and look green.
  require-main:
    name: Require main
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Promote must be dispatched from main, not ${GITHUB_REF}." >&2
          echo "Run it again with 'Use workflow from: Branch: main'." >&2
          exit 1

  guard:
    name: Promote guard
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      deployments: read
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      commit: ${{ steps.guard.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed in because a workflow token cannot read repository variables.
      STAGING_DEPLOY_PAUSED: ${{ vars.STAGING_DEPLOY_PAUSED }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      # Full history and tags: the guard finds where production went live.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ask the promote guard
        id: guard
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 scripts/delivery_state.py guard "$REQUESTED_VERSION" \
            >guard.out 2>guard.err || status=$?
          {
            echo "## Promote ${REQUESTED_VERSION}"
            echo
            echo '```'
            cat guard.out guard.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat guard.out guard.err
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          read -r _ tag _ commit < guard.out
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.guard.outputs.tag }} to production
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: prod
      url: ${{ vars.PROD_WORKER_URL }}
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TAG: ${{ needs.guard.outputs.tag }}
      COMMIT: ${{ needs.guard.outputs.commit }}
    steps:
      # This run's own commit, so the live check below is this run's script,
      # not the promoted version's copy (which may predate live-check).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Checked again here, not only by the guard, because re-running this job
      # of an old run reuses that run's guard verdict. Before migrations, so a
      # refused version changes nothing (#237).
      - name: Refuse a version from before production went live
        # shell: bash adds pipefail, so tee does not hide a refusal.
        shell: bash
        run: python3 scripts/delivery_state.py live-check production "$COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
      # The exact commit the guard accepted, never the head of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: uv sync --group dev --locked
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Apply D1 migrations (remote)
        run: uv run python -m pywrangler d1 migrations apply next-is-you-production --remote --config wrangler.production.jsonc
      - name: Deploy Worker
        run: uv run python -m pywrangler deploy --config wrangler.production.jsonc --keep-vars
      # Runs only when every step above succeeded, so a failed deployment
      # publishes no Release. Keyed on the Release being absent or a draft, not
      # on the tag: a version with a published Release (v0.2.0, v0.2.1, or one
      # promoted before) is left exactly as it is.
      - name: Publish the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The listing is used because a lookup by tag does not return drafts.
          found="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .draft")"
          state=absent
          if [[ "$found" == *true* ]]; then
            state=draft
          elif [[ "$found" == *false* ]]; then
            state=published
          fi
          case "$state" in
            published)
              echo "The Release for $TAG is already published."
              ;;
            draft)
              # Release Please wrote this draft's notes from the changelog.
              gh release edit "$TAG" --draft=false
              ;;
            absent)
              # Not expected for a version cut by Release Please. Take the notes
              # from the changelog section of the deployed commit.
              number="${TAG#v}"
              awk -v n="$number" '
                /^## / { if (found) exit; found = index($0, "[" n "]") > 0; next }
                found { print }
              ' CHANGELOG.md > release-notes.md
              if [[ ! -s release-notes.md ]]; then
                echo "No changelog section for $number." >&2
                exit 1
              fi
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
              ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
      # The Releases page should name the version production is running. A
      # rollback leaves the newer Release published, so Latest is moved here for
      # every outcome above. Only the Latest mark changes: the notes, the tag and
      # the published state are not touched. Setting it again is harmless.
      #
      # The mark is cosmetic and runs after production was updated, so a failure
      # here must not turn a finished deployment red. The summary reports it and
      # says how to set the mark by hand.
      - name: Mark the Release as Latest
        id: latest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --latest
      - name: Record deployment summary
        if: always()
        env:
          RELEASE_STATE: ${{ steps.release.outputs.state }}
          LATEST_OUTCOME: ${{ steps.latest.outcome }}
        run: |
          {
            echo "### Production promotion: ${TAG}"
            echo ""
            echo "- Commit: ${COMMIT}"
            echo "- Worker: next-is-you-held"
            echo "- D1 database: next-is-you-production"
            echo "- Status: ${{ job.status }}"
            echo "- URL: ${{ vars.PROD_WORKER_URL }}"
            echo "- GitHub Release: ${RELEASE_STATE:-not published}"
            case "${LATEST_OUTCOME}" in
              success) echo "- Latest Release: ${TAG}" ;;
              failure) echo "- Latest Release: NOT moved. Production runs ${TAG}; run \`gh release edit ${TAG} --latest\`." ;;
              *) echo "- Latest Release: not changed" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
