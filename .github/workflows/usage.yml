name: Cloudflare usage

# Workers Free limits are per account and reset at 00:00 UTC, and Cloudflare
# sends no usage alert on Free. Every hour this projects today's usage to the
# full day and fails above 50% of a limit; GitHub emails a failed scheduled run
# to whoever last changed the cron line. Its job is not a CI gate:
# scripts/delivery_state.py counts the gate jobs in ci.yml by name.
on:
  schedule:
    # Minute 30, so the first run of a UTC day projects from half an hour of
    # data rather than a few minutes.
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-usage
  cancel-in-progress: true

jobs:
  usage:
    name: Free plan daily usage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Project today's usage against the Free plan limits
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          python3 scripts/cloudflare_usage.py | tee -a "$GITHUB_STEP_SUMMARY"
