[project]
name = "next-is-you"
version = "0.1.0"
description = "Private family outpatient queue reminders"
requires-python = ">=3.13"
# FastAPI 0.142.0 adds an import-time telemetry key that violates Workers'
# startup entropy guard. Keep the Worker on the last compatible minor line.
dependencies = ["fastapi<0.142.0", "tzdata"]

[dependency-groups]
dev = [
    "httpx",
    "playwright",
    "pytest",
    "pytest-asyncio",
    "pytest-split>=0.11.0",
    "python-dotenv",
    "ruff",
    "uvicorn",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "browser: drives Chromium or starts a local Worker; needs dist/, Node and Playwright. Assigned by tests/conftest.py.",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "lf"
