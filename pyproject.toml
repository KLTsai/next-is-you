[project]
name = "next-is-you"
version = "0.1.0"
description = "Private family outpatient queue reminders"
requires-python = ">=3.13"
dependencies = ["fastapi", "tzdata"]

[dependency-groups]
dev = [
    "httpx",
    "playwright",
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "ruff",
    "uvicorn",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "lf"
