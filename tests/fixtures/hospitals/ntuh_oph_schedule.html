<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>Synthetic RegDeptSchedule (OPH)</title></head>
<body>
<div class="row gx-2 sticky-row-header">
  <div class="col-12 col-md-1"><div class="table-header-slim">看診日期</div></div>
  <div class="col-md-11 col-12"><div class="table-header">眼科部</div></div>
</div>

<div class="row gx-2 align-items-stretch" id="deptScheduleResult">
  <div class="col-1"><div class="table-content">
    <div class="date" style="text-align:center">11/10<div class='dot'></div>星期二</div>
  </div></div>
  <div class="col-md-11 col-12"><div class="table-content"><div class="row gx-2 gy-2">
    <div class="col-12 sm-table-header">11/10(二), 眼科部</div>
    <div class="row gx-2 gy-2" style="background-color:#ddebf8">
      <div class="col-12 d-flex align-items-center">
        <span class="me-2 date">上午門診</span>
      </div>
      <div class="col-12 col-sm-6 col-lg-3" id="1_合成醫師甲">
        <button class="doctor-tag " data-bs-toggle=modal data-bs-target=#largeInfo_1>
          <div class="row justify-content-between gx-0"><div class="col-auto">
            <div class="doc-name">合成醫師甲 | 03 診</div>
          </div></div>
          <div class="sub-spec" class="btn btn-secondary" title="角膜">
            一般眼科 | 角膜
          </div>
        </button>
      </div>
      <div class="col-12 col-sm-6 col-lg-3" id="2_合成醫師乙">
        <button class="doctor-tag " data-bs-toggle=modal data-bs-target=#largeInfo_2>
          <div class="doc-name">合成醫師乙 | 05 診</div>
          <div class="tag"><div class="first-reg" style="background-color:#e24444">額滿</div></div>
          <div class="sub-spec" class="btn btn-secondary" title="網膜">
            一般眼科 | 網膜
          </div>
        </button>
      </div>
      <div class="col-12 col-sm-6 col-lg-3" id="3_合成醫師丙">
        <button class="doctor-tag " data-bs-toggle=modal data-bs-target=#largeInfo_3>
          <div class="doc-name">合成醫師丙 | 07 診</div>
          <div class="tag"><div class="first-reg">停診</div></div>
          <div class="sub-spec" title="教學門診">
            一般眼科 | 教學門診
          </div>
        </button>
      </div>
    </div>
    <div class="row gx-2 gy-2" style="background-color:#ddebf8">
      <div class="col-12 d-flex align-items-center">
        <span class="me-2 date">下午門診</span>
      </div>
      <div class="col-12 col-sm-6 col-lg-3" id="4_合成醫師丁">
        <button class="doctor-tag " data-bs-toggle=modal data-bs-target=#largeInfo_4>
          <div class="doc-name">合成醫師丁 | 11 診</div>
          <div class="sub-spec" title="青光眼">
            一般眼科 | 青光眼
          </div>
        </button>
      </div>
    </div>
  </div></div></div>
</div>

<div class="row gx-2 align-items-stretch" id="deptScheduleResult">
  <div class="col-1"><div class="table-content">
    <div class="date" style="text-align:center">11/11<div class='dot'></div>星期三</div>
  </div></div>
  <div class="col-md-11 col-12"><div class="table-content"><div class="row gx-2 gy-2">
    <div class="col-12 sm-table-header">11/11(三), 眼科部</div>
    <div class="row gx-2 gy-2" style="background-color:#ddebf8">
      <div class="col-12 d-flex align-items-center">
        <span class="me-2 date">上午門診</span>
        <span class="me-2" style="color:gray;">(已逾當日掛號時間)</span>
      </div>
      <div class="col-12 col-sm-6 col-lg-3" id="5_合成醫師戊">
        <button class="doctor-tag " data-bs-toggle=modal data-bs-target=#largeInfo_5>
          <div class="doc-name">合成醫師戊 | 03 診</div>
          <div class="sub-spec" title="葡萄膜炎">
            一般眼科 | 葡萄膜炎
          </div>
        </button>
      </div>
      <div class="col-12 col-sm-6 col-lg-3" id="6_合成醫師己">
        <button class="doctor-tag " data-bs-toggle=modal data-bs-target=#largeInfo_6>
          <div class="doc-name">合成醫師己 | 06 診</div>
          <div class="tag"><div class="first-reg">颱風停診</div></div>
          <div class="sub-spec" title="眼整型">
            一般眼科 | 眼整型
          </div>
        </button>
      </div>
    </div>
  </div></div></div>
</div>

</body>
</html>
